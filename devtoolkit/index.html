<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         Basic SEO
         ===================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      DevToolkit — Free Developer Tools
    </title>

    <meta
      name="description"
      content="Free browser-based developer tools for JSON, TypeScript, Regex, UUID, Base64, JWT and more. Fast, private and easy to use."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- =====================================================
         Canonical
         ===================================================== -->

    <link
      rel="canonical"
      href="https://devtoolkit.dev/"
    />

    <!-- =====================================================
         Open Graph
         ===================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="DevToolkit — Free Developer Tools"
    />

    <meta
      property="og:description"
      content="Free browser-based developer tools for JSON, TypeScript, Regex, UUID, Base64, JWT and more."
    />

    <meta
      property="og:url"
      content="https://devtoolkit.dev/"
    />

    <meta
      property="og:site_name"
      content="DevToolkit"
    />

    <meta
      property="og:image"
      content="https://devtoolkit.dev/og-image.png"
    />

    <!-- =====================================================
         Twitter / X
         ===================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="DevToolkit — Free Developer Tools"
    />

    <meta
      name="twitter:description"
      content="Free browser-based developer tools for JSON, TypeScript, Regex, UUID, Base64, JWT and more."
    />

    <meta
      name="twitter:image"
      content="https://devtoolkit.dev/og-image.png"
    />

    <!-- =====================================================
         Theme / Browser
         ===================================================== -->

    <meta
      name="theme-color"
      content="#0f1117"
    />

    <!-- =====================================================
         Favicon
         ===================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
